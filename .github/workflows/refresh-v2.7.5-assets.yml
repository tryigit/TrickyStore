name: Refresh V2.7.5 assets

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/refresh-v2.7.5-assets.yml

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    if: github.repository == 'tryigit/CleveresTricky'
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN: '34265010949'
      TAG: 'V2.7.5'
      VERSION_CODE: '3938'
      BUILD_HASH: 'f98d141d'
      MODULE_ARTIFACT: 'CleveresTricky-V2.7.5-3938-f98d141d-release.zip'
      NEW_ZIP: 'CleveresTricky-V2.7.5-3938-f98d141d-release.zip'
      APK: 'encryptor-app-release.apk'
      UPDATE_FILE: 'update.json'

    steps:
      - name: Verify source build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.conclusion')
          test "$conclusion" = success || { echo "::error::Source build is not successful: $conclusion"; exit 1; }

      - name: Download exact V2.7.5 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets release-assets/app

          artifact_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/artifacts?per_page=100")
          module_id=$(jq -r --arg name "$MODULE_ARTIFACT" '.artifacts[] | select(.name == $name) | .id' <<<"$artifact_json" | head -n1)
          module_digest=$(jq -r --arg name "$MODULE_ARTIFACT" '.artifacts[] | select(.name == $name) | .digest // empty' <<<"$artifact_json" | head -n1)
          test -n "$module_id" && test "$module_id" != null || { echo '::error::Module artifact not found'; exit 1; }

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${module_id}/zip" \
            -o "release-assets/$NEW_ZIP"
          test -s "release-assets/$NEW_ZIP"
          unzip -tq "release-assets/$NEW_ZIP" >/dev/null

          if [[ "$module_digest" == sha256:* ]]; then
            expected=${module_digest#sha256:}
            actual=$(sha256sum "release-assets/$NEW_ZIP" | awk '{print $1}')
            test "$actual" = "$expected" || { echo "::error::Module artifact digest mismatch"; exit 1; }
          fi

          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name EncryptorApp --dir release-assets/app
          apk_path=$(find release-assets/app -type f -name '*.apk' -print -quit)
          test -n "$apk_path" && test -f "$apk_path" || { echo '::error::Expected signed APK was not downloaded'; exit 1; }
          cp "$apk_path" "release-assets/$APK"
          rm -rf release-assets/app

          (
            cd release-assets
            sha256sum -- "$NEW_ZIP" "$APK" | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Replace assets on existing V2.7.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')
          test -n "$release_id" || { echo '::error::Existing V2.7.5 release not found'; exit 1; }

          gh release upload "$TAG" \
            "release-assets/$NEW_ZIP" \
            "release-assets/$APK" \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          assets_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")
          mapfile -t stale_zips < <(
            jq -r --arg new "$NEW_ZIP" '
              .[]
              | select(.name | startswith("CleveresTricky-V2.7.5-"))
              | select(.name | endswith("-release.zip"))
              | select(.name != $new)
              | .name
            ' <<<"$assets_json"
          )
          for asset in "${stale_zips[@]}"; do
            gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done

          assets_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")
          names=$(jq -r '.[].name' <<<"$assets_json")
          grep -Fx "$NEW_ZIP" <<<"$names" >/dev/null
          grep -Fx "$APK" <<<"$names" >/dev/null
          grep -Fx 'SHA256SUMS' <<<"$names" >/dev/null
          stale=$(jq -r --arg new "$NEW_ZIP" '
            .[]
            | select(.name | startswith("CleveresTricky-V2.7.5-"))
            | select(.name | endswith("-release.zip"))
            | select(.name != $new)
            | .name
          ' <<<"$assets_json")
          test -z "$stale" || { echo "::error::A stale V2.7.5 module ZIP remains: $stale"; exit 1; }

      - name: Update update.json in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          gh repo clone "$GITHUB_REPOSITORY" "$tmpdir/repo" -- --depth 1 --branch "$GITHUB_REF_NAME"
          cd "$tmpdir/repo"
          export NEW_ZIP TAG VERSION_CODE BUILD_HASH SOURCE_REPOSITORY="$GITHUB_REPOSITORY"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          path = Path(os.environ.get("UPDATE_FILE", "update.json"))
          data = json.loads(path.read_text())
          data["version"] = f'{os.environ["TAG"]} ({os.environ["VERSION_CODE"]}-{os.environ["BUILD_HASH"]}-release)'
          data["versionCode"] = int(os.environ["VERSION_CODE"])
          data["zipUrl"] = (
              "https://github.com/"
              + os.environ["SOURCE_REPOSITORY"]
              + "/releases/download/"
              + quote(os.environ["TAG"], safe="")
              + "/"
              + quote(os.environ["NEW_ZIP"], safe="")
          )
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$UPDATE_FILE"
          if git diff --cached --quiet; then
            echo 'update.json is already current.'
          else
            git commit -m 'chore: refresh V2.7.5 update manifest'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Show published checksums
        shell: bash
        run: cat release-assets/SHA256SUMS
