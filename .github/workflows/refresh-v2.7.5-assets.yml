name: Refresh V2.7.5 assets

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/refresh-v2.7.5-assets.yml

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    if: github.repository == 'tryigit/CleveresTricky'
    runs-on: ubuntu-latest
    steps:
      - name: Verify source build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '34265010949'
        shell: bash
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.conclusion')
          test "$conclusion" = success || { echo "::error::Source build is not successful: $conclusion"; exit 1; }

      - name: Download exact V2.7.5 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '34265010949'
          MODULE_ARTIFACT: 'CleveresTricky-V2.7.5-3938-f98d141d-release.zip'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/module release-assets/app
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$MODULE_ARTIFACT" --dir release-assets/module
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name EncryptorApp --dir release-assets/app

          module_zip=$(find release-assets/module -type f -name 'CleveresTricky-V2.7.5-3938-f98d141d-release.zip' -print -quit)
          apk=$(find release-assets/app -type f -name 'encryptor-app-release.apk' -print -quit)
          test -n "$module_zip" && test -f "$module_zip" || { echo '::error::Expected module ZIP was not downloaded'; exit 1; }
          test -n "$apk" && test -f "$apk" || { echo '::error::Expected signed APK was not downloaded'; exit 1; }
          unzip -tq "$module_zip" >/dev/null

          cp "$module_zip" release-assets/
          cp "$apk" release-assets/
          rm -rf release-assets/module release-assets/app
          (
            cd release-assets
            sha256sum -- CleveresTricky-V2.7.5-3938-f98d141d-release.zip encryptor-app-release.apk | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Replace assets on existing V2.7.5 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: V2.7.5
          NEW_ZIP: CleveresTricky-V2.7.5-3938-f98d141d-release.zip
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')
          test -n "$release_id" || { echo '::error::Existing V2.7.5 release not found'; exit 1; }

          gh release upload "$TAG" \
            "release-assets/$NEW_ZIP" \
            release-assets/encryptor-app-release.apk \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          mapfile -t stale_zips < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq ".[] | select(.name | test(\"^CleveresTricky-V2\\.7\\.5-.*-release\\.zip$\")) | select(.name != \"${NEW_ZIP}\") | .name"
          )
          for asset in "${stale_zips[@]}"; do
            gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done

          names=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[].name')
          grep -Fx "$NEW_ZIP" <<<"$names" >/dev/null
          grep -Fx 'encryptor-app-release.apk' <<<"$names" >/dev/null
          grep -Fx 'SHA256SUMS' <<<"$names" >/dev/null
          if grep -E '^CleveresTricky-V2\.7\.5-.*-release\.zip$' <<<"$names" | grep -Fvx "$NEW_ZIP" >/dev/null; then
            echo '::error::A stale V2.7.5 module ZIP remains on the release'
            exit 1
          fi

      - name: Show published checksums
        shell: bash
        run: cat release-assets/SHA256SUMS
