[versions]
agp = "9.4.0"
bcpkix-jdk18on = "1.85"
bcprov-jdk18on = "1.85.2"
bcutil-jdk18on = "1.85"
kotlin = "2.4.20-RC3"
annotation = "1.10.0"
junit = "4.13.2"
compose-bom = "2026.08.00"
activity-compose = "1.13.0"
androidx-test-ext-junit = "1.3.0"
espresso-core = "3.7.0"
androidx-test-runner = "1.7.0"
robolectric = "4.16.1"
coroutines = "1.10.2"
kxml = "2.3.0"
json = "20260814"
mockito = "5.23.0"
remap = "0.1.5"

[libraries]
nanohttpd = { module = "org.nanohttpd:nanohttpd", version = "2.3.1" }
# Keep KGP's Maven coordinate explicit so Dependabot can map security advisories
# to the shared Kotlin plugin version instead of treating it as transitive only.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bcpkix-jdk18on" }
bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bcprov-jdk18on" }
bcutil-jdk18on = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bcutil-jdk18on" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kxml = { module = "net.sf.kxml:kxml2", version.ref = "kxml" }
json = { module = "org.json:json", version.ref = "json" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
remap-annotation = { module = "li.songe.remap:remap-annotation", version.ref = "remap" }
remap-processor = { module = "li.songe.remap:remap-processor", version.ref = "remap" }
cxx = { module = "org.lsposed.libcxx:libcxx", version = "29.0.14206865" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
lsplugin-cmaker = { id = "org.lsposed.lsplugin.cmaker", version = "1.4" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
remap = { id = "li.songe.remap", version.ref = "remap" }
